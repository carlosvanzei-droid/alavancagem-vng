<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alavancagem VNG</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alavancagem">
<meta name="theme-color" content="#F1EBE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191C" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Cinzel:wght@700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#F1EBE3; --card:#FBF8F3; --card-2:#F4EEE5; --ink:#23272B; --ink-2:#4A443E; --muted:#7A716A; --line:#DCD3C6;
  --cobre:#B87333; --cobre-soft:#F3E4D3;
  --good:#2F8F5B; --good-soft:#E1F0E6; --bad:#C94A3B; --bad-soft:#F7E2DE; --warn:#B9770E; --warn-soft:#F6EBD3;
  --font-body:Manrope,"Segoe UI",Arial,sans-serif; --font-display:Cinzel,Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#17191C; --card:#1F2226; --card-2:#262A2F; --ink:#EDE7DE; --ink-2:#CFC7BB; --muted:#9A928A; --line:#3A3E44;
    --cobre:#D08A48; --cobre-soft:#3A2D20;
    --good:#5CC48A; --good-soft:#1E3327; --bad:#E5705F; --bad-soft:#3A2320; --warn:#E0A443; --warn-soft:#3A2F18;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.5;font-size:15px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
a{color:var(--cobre)}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.top header{display:flex;gap:12px;align-items:center;min-width:0}
.seal{width:46px;height:46px;border-radius:50%;border:2px solid var(--cobre);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--ink);flex:none}
h1{font-family:var(--font-display);font-weight:700;font-size:21px;margin:0;line-height:1.2;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
h2{font-size:16px;font-weight:800;margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:13px;font-weight:800;margin:14px 0 8px;color:var(--cobre);text-transform:uppercase;letter-spacing:.04em}
.who{font-size:12px;color:var(--muted);text-align:right;overflow-wrap:anywhere}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}

label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--cobre);outline-offset:1px}
textarea{min-height:80px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.form .full{grid-column:1/-1}
.form .h{font-size:12px;color:var(--muted);margin:4px 0 0}

button{font:inherit;font-weight:700;font-size:15px;border-radius:10px;padding:10px 16px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink);min-height:44px}
button.primary{background:var(--ink);color:var(--bg)}
button.ghost{border-color:var(--line);color:var(--ink-2);padding:8px 12px;min-height:38px;font-size:14px}
button.danger{border-color:var(--bad);color:var(--bad)}
button.danger.armed{background:var(--bad);color:#fff}
button:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;padding:0;min-height:0;color:var(--cobre);font-weight:700;font-size:14px;cursor:pointer;text-decoration:underline}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{font-size:14px;color:var(--ink-2);min-height:1.2em}
.msg.err{color:var(--bad)} .msg.ok{color:var(--good)}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

.crumbs{display:flex;gap:6px;align-items:center;font-size:14px;margin-bottom:10px;flex-wrap:wrap}
.crumbs a{text-decoration:none;font-weight:700}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:10px 12px;font-weight:700;font-size:14px;color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--ink);border-bottom-color:var(--cobre)}
.tabs .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--bad-soft);color:var(--bad);font-size:11px;text-align:center}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:700}
.kpi .v{font-size:20px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}

.companies{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.co{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;transition:border-color .15s}
.co:hover{border-color:var(--cobre)}
.co .name{font-weight:800;font-size:16px;line-height:1.3}
.co .meta{font-size:13px;color:var(--muted);margin-top:2px}
.co .foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}

.score{display:inline-flex;align-items:baseline;gap:2px;font-weight:800;font-variant-numeric:tabular-nums}
.score .big{font-size:28px;line-height:1}
.score .of{font-size:13px;color:var(--muted)}
.score.good .big{color:var(--good)} .score.warn .big{color:var(--warn)} .score.bad .big{color:var(--bad)} .score.none .big{color:var(--muted)}

.chip{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--card-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.cobre{background:var(--cobre-soft);color:var(--cobre);border-color:transparent}

.tablewrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--cobre);text-align:left;padding:6px 8px;border-bottom:1px solid var(--cobre);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--card-2)}
tr.sel td{background:var(--cobre-soft)}

.bars{display:flex;flex-direction:column;gap:10px}
.bar .t{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.bar .t span:last-child{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.bar .track{height:8px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);overflow:hidden;margin-top:4px}
.bar .fill{height:100%;background:var(--cobre);border-radius:999px}

.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.metric{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card-2)}
.metric .top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.metric .l{font-size:12px;font-weight:700;color:var(--muted)}
.metric .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;margin:2px 0}
.metric .s{font-size:12px;color:var(--muted)}

.banner{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:12px 14px;margin-bottom:14px;background:var(--card-2);border:1px solid var(--line)}
.banner.good{background:var(--good-soft);border-color:transparent}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.bad{background:var(--bad-soft);border-color:transparent}
.banner b{display:block}
.banner p{margin:2px 0 0;font-size:14px;color:var(--ink-2)}

.pitem{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.pitem:last-child{border-bottom:0}
.pitem .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--muted)}
.pitem .dot.high,.pitem .dot.critical{background:var(--bad)} .pitem .dot.medium{background:var(--warn)} .pitem .dot.low{background:var(--good)}
.pitem .t{font-weight:700}
.pitem .d{font-size:13px;color:var(--muted)}
.pitem.done .t{text-decoration:line-through;color:var(--muted)}

.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.chartbox{position:relative}
.chartbox svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);display:none}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login .card{width:100%;max-width:400px}
.login header{display:flex;gap:12px;align-items:center;margin-bottom:16px}
pre.json{font-size:12px;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;max-height:360px;white-space:pre-wrap}
.loading{color:var(--muted);padding:20px 0;font-size:14px}
.foot2{font-size:12px;color:var(--muted);margin-top:24px}
.drivebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.drivebar .st{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.prog{margin-top:8px;font-size:13px;color:var(--ink-2);max-height:220px;overflow:auto;width:100%}
.prog div{padding:2px 0;border-bottom:1px dashed var(--line)}
.prog .ok{color:var(--good)} .prog .er{color:var(--bad)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--cobre);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--cobre-soft);border-radius:12px;padding:12px;margin:10px 0}
.linkbox input{flex:1 1 260px;font-size:14px;min-height:40px;background:var(--card)}
.steps{margin:8px 0 0;padding-left:20px;font-size:14px;color:var(--ink-2)}
.steps li{margin:4px 0}
code{font-size:13px;background:var(--card-2);border:1px solid var(--line);border-radius:6px;padding:1px 5px;overflow-wrap:anywhere}
@media (max-width:560px){
  h1{font-size:18px}
  .kpi .v{font-size:18px}
  .card{padding:14px}
  .scoregrid{grid-template-columns:1fr!important;gap:12px!important}
  .top{flex-direction:column}
  .top .who{text-align:left}
  .top .actions{justify-content:flex-start!important}
}
</style>
</head>
<body>

<div class="login" id="loginView" hidden>
  <section class="card">
    <header><div class="seal" aria-hidden="true">VNG</div><div><h1>Alavancagem</h1><p class="sub" id="loginSub">Entre com seu e-mail e senha</p></div></header>
    <form id="loginForm" autocomplete="on" style="display:flex;flex-direction:column;gap:10px">
      <div><label for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="username" required></div>
      <div><label for="lPass">Senha</label><input id="lPass" type="password" autocomplete="current-password" required minlength="6"></div>
      <button type="submit" class="primary" id="loginBtn">Entrar</button>
      <span class="msg" id="loginMsg" aria-live="polite"></span>
      <div class="actions" style="justify-content:space-between"><button type="button" class="linkbtn" id="forgotBtn">Esqueci a senha</button><button type="button" class="linkbtn" id="signupToggle">Primeiro acesso? Criar conta</button></div>
    </form>
    <form id="newPassForm" hidden style="display:flex;flex-direction:column;gap:10px">
      <div><label for="nPass">Nova senha</label><input id="nPass" type="password" autocomplete="new-password" required minlength="6"></div>
      <button type="submit" class="primary">Salvar nova senha</button>
      <span class="msg" id="newPassMsg" aria-live="polite"></span>
    </form>
  </section>
</div>

<div class="wrap" id="appView" hidden>
  <div class="top">
    <header>
      <a href="#/" class="seal" aria-label="Início" style="text-decoration:none">VNG</a>
      <div><h1>Alavancagem</h1><p class="sub" id="orgLine">—</p></div>
    </header>
    <div>
      <div class="who" id="whoAmI"></div>
      <div class="actions" style="justify-content:flex-end;margin-top:4px">
        <select id="orgSel" hidden style="width:auto;min-height:38px;padding:6px 10px;font-size:14px"></select>
        <a href="#/equipe" id="teamLink" class="linkbtn" style="font-size:13px">Equipe</a>
        <button type="button" class="ghost" id="logoutBtn">Sair</button>
      </div>
    </div>
  </div>
  <main id="main"><div class="loading">Carregando…</div></main>
  <p class="foot2">O score é um indicador interno de prontidão para crédito. Não representa aprovação bancária nem oferta de crédito.</p>
</div>

/* ============ ESTADO ============ */

var $$ = function(s, el){ return Array.prototype.slice.call((el||document).querySelectorAll(s)); };
function canWrite(){ return ['owner','admin','analyst'].indexOf(S.role) >= 0; }
function isAdmin(){ return ['owner','admin'].indexOf(S.role) >= 0; }

/* ============ FORMATAÇÃO ============ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(v){ return v==null || v==='' ? null : Number(v); }
var NF0 = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
var NF2 = new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2, maximumFractionDigits:2});
function brl(v){ v=num(v); if(v==null||!isFinite(v)) return '—'; return (v<0?'−':'')+'R$ '+NF0.format(Math.abs(v)); }
function brlc(v){
  v=num(v); if(v==null||!isFinite(v)) return '—';
  var a=Math.abs(v), s=v<0?'−':'';
  if(a>=1e9) return s+'R$ '+(a/1e9).toLocaleString('pt-BR',{maximumFractionDigits:2})+' bi';
  if(a>=1e6) return s+'R$ '+(a/1e6).toLocaleString('pt-BR',{maximumFractionDigits:2})+' mi';
  if(a>=1e4) return s+'R$ '+NF0.format(a/1e3)+' mil';
  return brl(v);
}
function pct(v, d){ v=num(v); if(v==null||!isFinite(v)) return '—'; return (v*100).toLocaleString('pt-BR',{maximumFractionDigits:d==null?1:d})+'%'; }
function times(v){ v=num(v); if(v==null||!isFinite(v)) return '—'; return v.toLocaleString('pt-BR',{maximumFractionDigits:2})+'×'; }
function ratio(v){ v=num(v); if(v==null||!isFinite(v)) return '—'; return v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(s){ if(!s) return '—'; var p=String(s).slice(0,10).split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmtDT(s){ if(!s) return '—'; var d=new Date(s); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
var MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function fmtMonth(s){ if(!s) return '—'; var p=String(s).split('-'); return MESES[+p[1]-1]+'/'+p[0].slice(2); }
function parseBRL(s){
  s = String(s==null?'':s).replace(/\s|R\$/g,'').replace('−','-');
  if(!s) return null;
  if(s.indexOf(',')>=0){ s = s.replace(/\./g,'').replace(',','.'); }
  else if(/^[+-]?\d{1,3}(\.\d{3})+$/.test(s)){ s = s.replace(/\./g,''); }
  var v = Number(s); return isFinite(v) ? v : NaN;

function moneyInput(v){ v=num(v); return v==null ? '' : NF2.format(v); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function scoreClass(v){ v=num(v); if(v==null) return 'none'; return v>=70?'good':v>=50?'warn':'bad'; }
function scoreHTML(v){ return '<span class="score '+scoreClass(v)+'"><span class="big">'+(v==null?'—':NF0.format(v))+'</span><span class="of">/100</span></span>'; }
function showMsg(el, t, k){ if(!el) return; el.textContent=t||''; el.className='msg'+(k?' '+k:''); }
function errText(e){
  if(!e) return '';
  var m = e.message || String(e);
  if(e.code==='23505') return 'Já existe um registro igual (mesmo período, mês ou CNPJ).';
  if(e.code==='23514') return 'Algum valor está fora do permitido. Confira datas e números.';
  if(e.code==='42501' || /row-level security|permission/i.test(m)) return 'Seu papel nesta organização não permite essa ação.';
  if(e.code==='23503') return 'Este registro está ligado a outros dados.';
  return m;
}

var LBL = {
  role:{owner:'Owner',admin:'Admin',analyst:'Analista',viewer:'Leitura'},
  req:{draft:'Rascunho',submitted:'Enviado',analysis:'Em análise',under_review:'Em revisão',approved:'Aprovado',rejected:'Recusado',cancelled:'Cancelado'},
  run:{calculated:'Calculado',needs_reconciliation:'Precisa reconciliar',ready_for_ai:'Pronto para revisão por IA',completed:'Concluído'},
  next:{reconcile_high_priority_items:'Resolver as pendências altas antes de seguir.',run_ai_credit_review:'Pode enviar para a revisão por IA.',improve_score_before_review:'Melhorar os pontos fracos antes da revisão (meta: 70+).'},

  sync:{never:'Nunca sincronizado',running:'Sincronizando',ok:'Sincronizado',partial:'Sincronizado em parte',error:'Erro'}
};
var CHIPK = {
  run:{calculated:'',needs_reconciliation:'bad',ready_for_ai:'good',completed:'good'},

function guarElig(r){
  if(r.eligible_value!=null) return Math.max(0, +r.eligible_value);
  var base = r.conservative_value!=null ? +r.conservative_value : (r.market_value!=null ? +r.market_value*0.7 : null);
  if(base==null) return null;
  return Math.max(0, base - (+r.existing_liens||0));
}

function fieldHTML(f, v){
  if(f.g) return '<h3 class="full" style="margin:6px 0 -4px">'+esc(f.g)+'</h3>';
  var id='f_'+f.k, req=f.req?' required':'', ph=f.ph?' placeholder="'+esc(f.ph)+'"':'', inp;
  if(v==null && f.def!=null) v=f.def;
  if(f.t==='select'){
    var opts = typeof f.opts==='string' ? Object.keys(LBL[f.opts]).map(function(k){ return [k, LBL[f.opts][k]]; }) : f.opts.map(function(o){ return [o,o]; });
    if(v && !opts.some(function(o){ return o[0]===v; })) opts.push([v,v]);
    inp = '<select id="'+id+'" name="'+f.k+'"'+req+'>'+(f.req?'':'<option value=""></option>')+opts.map(function(o){ return '<option value="'+esc(o[0])+'"'+(o[0]===v?' selected':'')+'>'+esc(o[1])+'</option>'; }).join('')+'</select>';
  } else if(f.t==='money'){
    inp = '<input id="'+id+'" name="'+f.k+'" type="text" inputmode="decimal" value="'+esc(moneyInput(v))+'"'+req+ph+'>';
  } else if(f.t==='int'){
    inp = '<input id="'+id+'" name="'+f.k+'" type="number" inputmode="numeric" step="1" min="0" value="'+esc(v==null?'':v)+'"'+req+ph+'>';
  } else if(f.t==='textarea'){
    inp = '<textarea id="'+id+'" name="'+f.k+'"'+req+ph+'>'+esc(v||'')+'</textarea>';
  } else {
    var type = f.t==='date'?'date':f.t==='url'?'url':'text';
    inp = '<input id="'+id+'" name="'+f.k+'" type="'+type+'" value="'+esc(v==null?'':String(v).slice(0, f.t==='date'?10:9999))+'"'+req+ph+'>';
  }
  return '<div'+(f.full?' class="full"':'')+'><label for="'+id+'">'+esc(f.l)+(f.req?' *':'')+'</label>'+inp+(f.h?'<p class="h">'+esc(f.h)+'</p>':'')+'</div>';
}
function readForm(form, fields){
  var out={}, bad=null;
  fields.forEach(function(f){
    if(f.g) return;
    var el = form.elements[f.k]; if(!el) return;
    var raw = el.value.trim();
    if(f.t==='money'){ var v=parseBRL(raw); if(v!==null && isNaN(v)) bad=f.l; out[f.k]=v; }
    else if(f.t==='int'){ out[f.k] = raw==='' ? null : parseInt(raw,10); }
    else out[f.k] = raw==='' ? null : raw;
  });
  if(bad) throw new Error('Valor inválido em "'+bad+'". Use números, ex.: 1.250.000,00');
  return out;
}
function armDelete(btn, fn){
  btn.addEventListener('click', function(){
    if(btn.classList.contains('armed')){ fn(); return; }
    var old = btn.textContent;
    btn.classList.add('armed'); btn.textContent='Confirmar exclusão';
    setTimeout(function(){ btn.classList.remove('armed'); btn.textContent=old; }, 4000);
  });
}

function renderEntity(box, key, companyId, onChange){
  var E = ENT[key], rows = [], editing = null;
  box.innerHTML = '<div class="loading">Carregando…</div>';
  function load(){
    return SB.from(key).select('*').eq('company_id', companyId).order(E.order[0], {ascending:E.order[1]}).then(function(r){
      if(r.error){ box.innerHTML='<p class="msg err">'+esc(errText(r.error))+'</p>'; return; }
      rows = r.data || []; draw();
    });
  }
  function draw(){
    var h = '<section class="card"><div class="row between" style="margin-bottom:8px"><h2 style="margin:0">'+rows.length+' '+(rows.length===1?E.one:E.one.replace(/ão$/,'õe').replace(/([^s])$/,'$1s'))+'</h2>'+
      (canWrite()?'<button type="button" class="primary" id="addBtn">Adicionar '+esc(E.one)+'</button>':'')+'</div>';
    if(!rows.length) h += '<p class="empty">Nada cadastrado ainda.</p>';
    else {
      h += '<div class="tablewrap"><table><thead><tr>'+E.cols.map(function(c){ return '<th'+(c[2]?' class="num"':'')+'>'+esc(c[0])+'</th>'; }).join('')+'</tr></thead><tbody>'+
        rows.map(function(r){ return '<tr data-id="'+r.id+'" class="'+(canWrite()?'click':'')+(editing&&editing.id===r.id?' sel':'')+'">'+E.cols.map(function(c){ return '<td'+(c[2]?' class="num"':'')+'>'+c[1](r)+'</td>'; }).join('')+'</tr>'; }).join('')+
        '</tbody></table></div>';
    }
    if(E.hint) h += '<p class="hint">'+esc(E.hint)+'</p>';
    h += '</section><div id="formBox"></div>';
    box.innerHTML = h;
    var add = $('#addBtn', box); if(add) add.addEventListener('click', function(){ editing={}; drawForm(); });
    if(canWrite()) $$('tr.click', box).forEach(function(tr){ tr.addEventListener('click', function(){ editing = rows.find(function(x){ return x.id===tr.dataset.id; }); draw(); }); });
    if(editing) drawForm();
  }
  function drawForm(){
    var fb = $('#formBox', box), isNew = !editing.id;
    fb.innerHTML = '<section class="card"><h2>'+(isNew?'Nova '+E.one:'Editar '+E.one).replace(/^Nova (período|documento)/,'Novo $1')+'</h2>'+
      '<form class="form" id="entForm" autocomplete="off">'+E.fields.map(function(f){ return fieldHTML(f, editing[f.k]); }).join('')+
      '<div class="full actions"><button type="submit" class="primary">Salvar</button><button type="button" class="ghost" id="cancelBtn">Cancelar</button>'+
      (isNew?'':'<button type="button" class="danger" id="delBtn">Apagar</button>')+'<span class="msg" id="entMsg" aria-live="polite"></span></div></form></section>';
    var form = $('#entForm', fb), msg = $('#entMsg', fb);
    form.scrollIntoView({behavior:'smooth', block:'nearest'});
    $('#cancelBtn', fb).addEventListener('click', function(){ editing=null; draw(); });
    form.addEventListener('submit', function(ev){
      ev.preventDefault();
      var data; try{ data = readForm(form, E.fields); }catch(e){ showMsg(msg, e.message, 'err'); return; }
      showMsg(msg, 'Salvando…');
      var q = isNew ? SB.from(key).insert(Object.assign({company_id:companyId}, data)) : SB.from(key).update(data).eq('id', editing.id);
      q.then(function(r){
        if(r.error){ showMsg(msg, errText(r.error), 'err'); return; }
        editing=null; load(); if(onChange) onChange();
      });
    });
    var del = $('#delBtn', fb);
    if(del) armDelete(del, function(){
      SB.from(key).delete().eq('id', editing.id).then(function(r){
        if(r.error){ showMsg(msg, errText(r.error), 'err'); return; }
        editing=null; load(); if(onChange) onChange();
      });
    });
  }
  load();
}

function kpi(l, v, s, cls){ return '<div class="kpi"><div class="l">'+esc(l)+'</div><div class="v"'+(cls?' style="color:var(--'+cls+')"':'')+'>'+v+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>'; }

var COMP = [['documentation_score','Documentação',15],['financial_score','Financeiro',25],['debt_score','Endividamento',20],['payment_capacity_score','Capacidade de pagamento',25],['guarantees_score','Garantias',15]];
function scoreBreakdown(s){
  var pen = s.rationale && s.rationale.high_pending_penalty;
  return '<div class="bars">'+COMP.map(function(c){
    var v = +s[c[0]]||0;
    return '<div class="bar"><div class="t"><span>'+c[1]+'</span><span>'+NF0.format(v)+' / '+c[2]+'</span></div><div class="track"><div class="fill" style="width:'+Math.min(100, v/c[2]*100)+'%"></div></div></div>';
  }).join('')+'</div>'+(pen?'<p class="hint">Penalidade de −'+NF0.format(pen)+' por pendências altas abertas (−3 cada, máx. −10).</p>':'');
}

function metricCard(l, v, s, state){
  var c = state===true?'<span class="chip good">bom</span>':state===false?'<span class="chip bad">atenção</span>':state==='mid'?'<span class="chip warn">médio</span>':'';
  return '<div class="metric"><div class="top2"><span class="l">'+esc(l)+'</span>'+c+'</div><div class="v">'+v+'</div><div class="s">'+s+'</div></div>';
}
function lvl(v, good, okay, higherBetter){
  if(v==null) return null;
  if(higherBetter) return v>=good ? true : v>=okay ? 'mid' : false;
  return v<=good ? true : v<=okay ? 'mid' : false;
}

/* ============ GOOGLE DRIVE ============ */
function callFn(name, body){
  return SB.functions.invoke(name, {body: body}).then(function(r){
    if(!r.error) return r.data;
    var ctx = r.error.context;
    if(ctx && typeof ctx.json === 'function') return ctx.json().then(function(j){ throw new Error(j && j.error || r.error.message); }, function(){ throw new Error(r.error.message); });
    throw new Error(r.error.message);
  });
}
var DRIVE_CFG = null;
function driveConfig(){
  if(DRIVE_CFG) return Promise.resolve(DRIVE_CFG);
  return callFn('drive-sync', {action:'config'}).then(function(c){ DRIVE_CFG=c; return c; }).catch(function(){ return {google:false, anthropic:false}; });
}
// scan -> extract (em lotes) -> finish. log(texto, classe) recebe o progresso.
function syncCompany(coId, log){
  log = log || function(){};
  var runId=null, total=0, done=0;
  return callFn('drive-sync', {action:'scan', company_id:coId}).then(function(s){
    runId=s.run_id; total=s.pending;
    log(s.found+' arquivo(s) na pasta · '+s.new+' novo(s)'+(s.changed?' · '+s.changed+' alterado(s)':'')+(s.missing?' · '+s.missing+' removido(s)':'')+' · '+s.pending+' para ler');
    function step(){
      return callFn('drive-sync', {action:'extract', company_id:coId, run_id:runId, max:2}).then(function(x){
        (x.results||[]).forEach(function(r){ done++; log((r.ok?'✓ ':'✗ ')+r.name+(r.ok?' — '+(r.category||'')+(r.applied?' · '+r.applied+' dado(s) gravado(s)':''):' — '+r.error), r.ok?'ok':'er'); });
        if(x.remaining>0 && x.processed>0) { log('Lendo… '+done+' de '+total); return step(); }
      });
    }
    return total ? step() : null;
  }).then(function(){
    log('Recalculando o score…');
    return callFn('drive-sync', {action:'finish', company_id:coId, run_id:runId});
  }).then(function(f){ log(f.message, f.status==='ok'?'ok':''); return f; });
}
function renderDriveBar(box, co){
  if(!box) return;
  if(!co.drive_folder_url){
    box.innerHTML = '<div class="drivebar"><span class="hint" style="margin:0">Sem pasta do Google Drive. '+(canWrite()?'Toque em Editar e cole o link da pasta da empresa para ler os documentos automaticamente.':'')+'</span></div>';
    return;
  }
  box.innerHTML = '<div class="drivebar"><div class="st"><b>Google Drive</b>'+chip('sync', co.drive_sync_status)+

function kitState(k){

function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).catch(function(){ return fallbackCopy(t); });
  return Promise.resolve(fallbackCopy(t));
}
function fallbackCopy(t){ var i=document.createElement('textarea'); i.value=t; document.body.appendChild(i); i.select(); try{ document.execCommand('copy'); }catch(e){} i.remove(); }

/* ============ FATURAMENTO ============ */
function monthAdd(ym, n){ var p=ym.split('-'), d=new Date(+p[0], +p[1]-1+n, 1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function tabFaturamento(box, co){
  box.innerHTML = '<div class="loading">Carregando…</div>';
  SB.from('monthly_revenue').select('*').eq('company_id', co.id).order('month',{ascending:true}).then(function(r){
    if(r.error){ box.innerHTML='<p class="msg err">'+esc(errText(r.error))+'</p>'; return; }
    var rows=r.data, byM={};
    rows.forEach(function(x){ byM[x.month.slice(0,7)]=x; });
    var lastYM = rows.length ? rows[rows.length-1].month.slice(0,7) : monthAdd(todayISO().slice(0,7), -1);
    var endYM = lastYM;
    var h = '<section class="card"><h2>Últimos 24 meses</h2><div class="chartbox"><svg id="revChart" viewBox="0 0 720 240" role="img" aria-label="Faturamento mensal"></svg><div class="tip" id="revTip"></div></div>';
    var w12 = rows.filter(function(x){ return x.month.slice(0,7) > monthAdd(lastYM,-12); });
    var avg = w12.length ? w12.reduce(function(s,x){ return s + +x.amount; },0)/w12.length : null;
    h += '<p class="hint">Média da janela de 12 meses usada pelo motor: <b>'+brl(avg)+'</b> ('+w12.length+' de 12 meses informados'+(w12.length && w12.length<12?' — meses faltando contam como ausentes, não como zero':'')+').</p></section>';
    if(canWrite()){
      h += '<section class="card"><div class="row between"><h2 style="margin:0">Lançar 12 meses</h2><div class="actions"><label for="endM" style="margin:0">até</label><input id="endM" type="month" style="width:auto" value="'+endYM+'"></div></div>'+
        '<form id="revForm" autocomplete="off"><div class="months" id="monthGrid" style="margin-top:12px"></div>'+
        '<div class="actions" style="margin-top:12px"><button type="submit" class="primary">Salvar meses</button><span class="msg" id="revMsg"></span></div></form>'+
        '<p class="hint">Deixe em branco o que não quiser alterar. Para apagar um mês, digite 0 e depois remova na tabela abaixo.</p></section>';
    }
    h += '<section class="card"><h2>Meses lançados</h2>'+(rows.length?'<div class="tablewrap"><table><thead><tr><th>Mês</th><th class="num">Faturamento</th><th class="num">Var. mês</th>'+(canWrite()?'<th></th>':'')+'</tr></thead><tbody>'+
      rows.slice().reverse().map(function(x,i,arr){ var prev=arr[i+1]; var v = prev && +prev.amount>0 ? (+x.amount / +prev.amount - 1) : null;
        return '<tr><td>'+fmtMonth(x.month)+'</td><td class="num">'+brl(x.amount)+'</td><td class="num" style="color:var(--'+(v==null?'muted':v>=0?'good':'bad')+')">'+(v==null?'—':(v>=0?'+':'')+pct(v))+'</td>'+(canWrite()?'<td class="num"><button type="button" class="ghost delM" data-id="'+x.id+'" style="min-height:30px;padding:4px 10px">Apagar</button></td>':'')+'</tr>'; }).join('')+
      '</tbody></table></div>':'<p class="empty">Nenhum mês lançado.</p>')+'</section>';
    box.innerHTML = h;
    drawRevChart(rows, lastYM);
    function grid(){
      var e=$('#endM').value; if(!e) return;
      var g=''; for(var i=11;i>=0;i--){ var ym=monthAdd(e,-i), cur=byM[ym];
        g += '<div><label for="m_'+ym+'">'+fmtMonth(ym+'-01')+'</label><input id="m_'+ym+'" data-ym="'+ym+'" inputmode="decimal" value="'+(cur?esc(moneyInput(cur.amount)):'')+'" placeholder="—"></div>'; }
      $('#monthGrid').innerHTML = g;
    }
    if(canWrite()){
      grid();
      $('#endM').addEventListener('change', grid);
      $('#revForm').addEventListener('submit', function(ev){
        ev.preventDefault();
        var up=[], bad=false, msg=$('#revMsg');
        $$('#monthGrid input').forEach(function(inp){
          var raw=inp.value.trim(); if(!raw) return;
          var v=parseBRL(raw); if(isNaN(v)||v<0){ bad=true; inp.style.borderColor='var(--bad)'; return; }
          var cur=byM[inp.dataset.ym]; if(cur && +cur.amount===v) return;
          up.push({company_id:co.id, month:inp.dataset.ym+'-01', amount:v});
        });
        if(bad){ showMsg(msg,'Há valores inválidos (em vermelho).','err'); return; }
        if(!up.length){ showMsg(msg,'Nada mudou.',''); return; }
        showMsg(msg,'Salvando…');
        SB.from('monthly_revenue').upsert(up, {onConflict:'company_id,month'}).then(function(r){
          if(r.error){ showMsg(msg, errText(r.error), 'err'); return; }
          tabFaturamento(box, co);
        });
      });
      $$('.delM', box).forEach(function(b){ armDelete(b, function(){
        SB.from('monthly_revenue').delete().eq('id', b.dataset.id).then(function(r){ if(!r.error) tabFaturamento(box, co); });
      }); });
    }
  });
}
function drawRevChart(rows, lastYM){
  var svg=$('#revChart'); if(!svg) return;
  var byM={}; rows.forEach(function(x){ byM[x.month.slice(0,7)]=+x.amount; });
  var ms=[]; for(var i=23;i>=0;i--) ms.push(monthAdd(lastYM,-i));
  var vals=ms.map(function(m){ return byM[m]; });
  var max=Math.max.apply(null, vals.filter(function(v){ return v!=null; }).concat([1]));
  var W=720,H=240,L=56,R=8,T=12,B=28, cw=(W-L-R)/ms.length, bw=Math.max(6, cw*0.62);
  var y=function(v){ return T + (H-T-B)*(1 - v/max); };
  var step = niceStep(max/4), s='';
  for(var g=0; g<=max*1.0001; g+=step){ s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g).toFixed(1)+'" y2="'+y(g).toFixed(1)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y(g)+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+shortN(g)+'</text>'; }
  var w12start = monthAdd(lastYM,-11);
  ms.forEach(function(m,i){
    var x = L + i*cw + (cw-bw)/2, v=vals[i];
    if(v!=null) s+='<rect class="rb" data-i="'+i+'" x="'+x.toFixed(1)+'" y="'+y(v).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,(H-B-y(v))).toFixed(1)+'" rx="3" fill="'+(m>=w12start?'var(--cobre)':'var(--line)')+'"/>';
    else s+='<rect x="'+x.toFixed(1)+'" y="'+(H-B-2)+'" width="'+bw.toFixed(1)+'" height="2" fill="var(--line)"/>';
    if(i%3===2 || i===ms.length-1) s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+fmtMonth(m+'-01')+'</text>';
  });
  svg.innerHTML = s;
  var tip=$('#revTip');
  $$('.rb', svg).forEach(function(r){
    r.addEventListener('mouseenter', function(){ var i=+r.dataset.i; tip.textContent=fmtMonth(ms[i]+'-01')+' · '+brl(vals[i]); var bb=r.getBoundingClientRect(), pb=svg.parentNode.getBoundingClientRect(); tip.style.left=(bb.left-pb.left+bb.width/2)+'px'; tip.style.top=(bb.top-pb.top)+'px'; tip.style.display='block'; });
    r.addEventListener('mouseleave', function(){ tip.style.display='none'; });
  });
}
function niceStep(x){ var p=Math.pow(10, Math.floor(Math.log10(x||1))), n=x/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function shortN(v){ return v>=1e6 ? (v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi' : v>=1e3 ? NF0.format(v/1e3)+' mil' : NF0.format(v); }

      $('#f_title').focus();

      h+='<section class="card"><h2>Liberar acesso</h2><form class="form" id="invForm" autocomplete="off">'+
        '<div class="full"><label for="iEmail">E-mail</label><input id="iEmail" type="email" required placeholder="pessoa@empresa.com.br"></div>'+
        '<div><label for="iRole">Papel</label><select id="iRole">'+roleOpts('analyst')+'</select></div>'+
        '<div class="full actions"><button class="primary" type="submit">Liberar</button><span class="msg" id="iMsg"></span></div></form>'+
        '<p class="hint">A pessoa abre este site, toca em "Primeiro acesso? Criar conta" com esse e-mail e confirma pelo link que chega. Ao confirmar, já entra com o papel escolhido.</p>'+
        (inv.length?'<h3>Aguardando cadastro</h3>'+inv.map(function(i){ return '<div class="pitem"><div class="grow"><div class="t">'+esc(i.email)+'</div><div class="d">'+LBL.role[i.role]+' · liberado em '+fmtDate(i.created_at)+'</div></div><button type="button" class="ghost iDel" data-e="'+esc(i.email)+'">Cancelar</button></div>'; }).join(''):'')+
        '</section>';
    }
    if(isAdmin()){
      h+='<section class="card"><h2>Google Drive</h2><div id="driveCfg"><p class="hint">Verificando configuração…</p></div>'+
        '<form class="form" id="rootForm" autocomplete="off" style="margin-top:12px"><div class="full"><label for="rootUrl">Pasta-mãe das empresas (link do Drive)</label>'+
        '<input id="rootUrl" type="url" placeholder="https://drive.google.com/drive/folders/…" value="'+esc(S.org.drive_root_folder_url||'')+'">'+
        '<p class="h">Cada subpasta vira uma empresa. Empresas que já existem com o mesmo nome são ligadas à subpasta, sem duplicar.</p></div>'+
        '<div class="full actions"><button class="primary" type="submit">Salvar</button><span class="msg" id="rootMsg"></span></div></form></section>';
    }
    h+='<section class="card"><h2>Papéis</h2><div class="pitem"><div><div class="t">Owner</div><div class="d">Tudo, inclusive gerenciar membros e apagar a organização.</div></div></div>'+
      '<div class="pitem"><div><div class="t">Admin</div><div class="d">Edita dados, apaga empresas e libera analistas e leitores.</div></div></div>'+
      '<div class="pitem"><div><div class="t">Analista</div><div class="d">Cadastra e edita dados, cria pedidos e calcula scores.</div></div></div>'+
      '<div class="pitem"><div><div class="t">Leitura</div><div class="d">Só visualiza.</div></div></div></section>';
    main.innerHTML=h;
    $$('.mRole').forEach(function(s){ s.addEventListener('change', function(){
      SB.from('organization_members').update({role:s.value}).eq('organization_id',S.org.id).eq('user_id',s.dataset.id).then(function(r){ if(r.error) showMsg($('#tMsg'),errText(r.error),'err'); else viewTeam(main); });
    }); });
    $$('.mDel').forEach(function(b){ armDelete(b, function(){
      SB.from('organization_members').delete().eq('organization_id',S.org.id).eq('user_id',b.dataset.id).then(function(r){ if(r.error) showMsg($('#tMsg'),errText(r.error),'err'); else viewTeam(main); });
    }); });
    $$('.iDel').forEach(function(b){ b.addEventListener('click', function(){
      SB.from('organization_invites').delete().eq('organization_id',S.org.id).eq('email',b.dataset.e).then(function(){ viewTeam(main); });
    }); });
    var rf=$('#rootForm');
    if(rf) rf.addEventListener('submit', function(ev){
      ev.preventDefault();
      var v=$('#rootUrl').value.trim()||null, msg=$('#rootMsg');
      if(v && !/drive\.google\.com|^[A-Za-z0-9_-]{20,}$/.test(v)){ showMsg(msg,'Cole o link de uma pasta do Google Drive.','err'); return; }
      SB.from('organizations').update({drive_root_folder_url:v}).eq('id',S.org.id).then(function(r){
        if(r.error){ showMsg(msg, errText(r.error), 'err'); return; }
        S.org.drive_root_folder_url=v; showMsg(msg,'Salvo. Agora use "Sincronizar tudo com o Drive" na tela de empresas.','ok');
      });
    });
    if($('#driveCfg')) driveConfig().then(function(c){
      var ok=function(b){ return b?'<span class="chip good">configurado</span>':'<span class="chip bad">falta configurar</span>'; };
      $('#driveCfg').innerHTML='<div class="pitem"><div class="grow"><div class="t">Conta de serviço do Google '+ok(c.google)+'</div>'+
        (c.service_account_email?'<div class="d">Compartilhe a pasta-mãe (como Leitor) com: <code>'+esc(c.service_account_email)+'</code> <button type="button" class="linkbtn" id="cpSa">copiar</button></div>':'<div class="d">Cadastre o secret GOOGLE_SERVICE_ACCOUNT_JSON no Supabase.</div>')+'</div></div>'+
        '<div class="pitem"><div class="grow"><div class="t">Leitura dos documentos (Claude) '+ok(c.anthropic)+'</div><div class="d">'+(c.anthropic?'Modelo: '+esc(c.model||''):'Cadastre o secret ANTHROPIC_API_KEY no Supabase.')+'</div></div></div>';
      var cp=$('#cpSa'); if(cp) cp.addEventListener('click', function(){ copyText(c.service_account_email).then(function(){ cp.textContent='copiado'; }); });
    });
    var f=$('#invForm');
    if(f) f.addEventListener('submit', function(ev){
      ev.preventDefault(); var msg=$('#iMsg'); showMsg(msg,'Liberando…');
      SB.rpc('add_organization_member',{p_org:S.org.id, p_email:$('#iEmail').value.trim(), p_role:$('#iRole').value}).then(function(r){
        if(r.error){ showMsg(msg, errText(r.error), 'err'); return; }
        viewTeam(main);
      });
    });
  });
}

/* ============ SESSÃO / ORGANIZAÇÕES ============ */
function loadOrgs(){
  return SB.from('organization_members').select('organization_id, role, organizations(id,name,drive_root_folder_url)').eq('user_id', S.user.id).then(function(r){
    if(r.error) throw r.error;
    S.orgs = (r.data||[]).filter(function(m){ return m.organizations; }).map(function(m){ return {id:m.organization_id, name:m.organizations.name, role:m.role, drive_root_folder_url:m.organizations.drive_root_folder_url}; })
      .sort(function(a,b){ return a.name.localeCompare(b.name); });
  });
}
function pickOrg(id){
  var saved=null; try{ saved=localStorage.getItem('alav.org'); }catch(e){}
  S.org = S.orgs.find(function(o){ return o.id===(id||saved); }) || S.orgs[0] || null;
  S.role = S.org && S.org.role;
  if(S.org){ try{ localStorage.setItem('alav.org', S.org.id); }catch(e){} }
  $('#orgLine').textContent = S.org ? S.org.name+' · '+LBL.role[S.role] : 'sem organização';
  $('#teamLink').hidden = !S.org;
  var sel=$('#orgSel');
  sel.hidden = S.orgs.length < 2;
  sel.innerHTML = S.orgs.map(function(o){ return '<option value="'+o.id+'"'+(S.org&&o.id===S.org.id?' selected':'')+'>'+esc(o.name)+'</option>'; }).join('');
}
$('#orgSel').addEventListener('change', function(){ pickOrg(this.value); location.hash='#/'; route(); });

function showLogin(){ $('#appView').hidden=true; $('#loginView').hidden=false; }
function showApp(){
  $('#loginView').hidden=true; $('#appView').hidden=false;
  $('#whoAmI').textContent = S.user.email || '';
  loadOrgs().then(function(){
    pickOrg();
    if(!S.org){
      $('#main').innerHTML = '<section class="card"><h2>Seu acesso ainda não foi liberado</h2>'+
        '<p>Você entrou como <b>'+esc(S.user.email)+'</b>, mas este e-mail ainda não faz parte de nenhuma organização.</p>'+
        '<p class="hint">Peça a um owner ou admin para liberar seu e-mail na tela Equipe. Depois, saia e entre de novo.</p>'+
        '<div class="actions" style="margin-top:12px"><button type="button" class="ghost" id="retryOrgs">Verificar de novo</button></div></section>';
      $('#retryOrgs').addEventListener('click', showApp);
      return;
    }
    route();
  }).catch(function(e){ $('#main').innerHTML='<p class="msg err">'+esc(errText(e))+'</p>'; });
}

var signupMode=false;
$('#loginForm').addEventListener('submit', function(ev){
  ev.preventDefault();
  var email=$('#lEmail').value.trim(), pass=$('#lPass').value, msg=$('#loginMsg'), btn=$('#loginBtn');
  btn.disabled=true; showMsg(msg, signupMode?'Criando conta…':'Entrando…');
  if(signupMode){
    SB.auth.signUp({email:email, password:pass, options:{emailRedirectTo: location.origin + '/'}}).then(function(r){
      btn.disabled=false;
      if(r.error){ showMsg(msg,'Não criou: '+r.error.message,'err'); return; }
      if(r.data && r.data.session){ $('#lPass').value=''; showMsg(msg,''); return; }
      $('#signupToggle').click();
      showMsg(msg,'Conta criada. Abra o e-mail de confirmação, clique no link e depois entre aqui.','ok');
    });
    return;
  }
  SB.auth.signInWithPassword({email:email, password:pass}).then(function(r){
    btn.disabled=false;
    if(r.error){ showMsg(msg, /invalid/i.test(r.error.message)?'E-mail ou senha incorretos.':/confirm/i.test(r.error.message)?'Confirme seu e-mail antes de entrar (veja a caixa de entrada).':'Não entrou: '+r.error.message,'err'); return; }
    $('#lPass').value=''; showMsg(msg,'');
  });
});
$('#signupToggle').addEventListener('click', function(){
  signupMode=!signupMode;
  $('#loginBtn').textContent = signupMode?'Criar conta':'Entrar';
  $('#lPass').autocomplete = signupMode?'new-password':'current-password';
  $('#loginSub').textContent = signupMode?'Crie sua senha (mínimo 6 caracteres)':'Entre com seu e-mail e senha';
  this.textContent = signupMode?'Já tenho conta':'Primeiro acesso? Criar conta';
  showMsg($('#loginMsg'),'');
});
$('#forgotBtn').addEventListener('click', function(){
  var email=$('#lEmail').value.trim(), msg=$('#loginMsg');
  if(!email){ showMsg(msg,'Digite seu e-mail acima e toque em "Esqueci a senha" de novo.','err'); $('#lEmail').focus(); return; }
  SB.auth.resetPasswordForEmail(email,{redirectTo: location.origin + '/'}).then(function(r){
    if(r.error) showMsg(msg,'Não enviou: '+r.error.message,'err');
    else showMsg(msg,'Se esse e-mail tiver conta, chega um link para criar nova senha.','ok');
  });
});
$('#newPassForm').addEventListener('submit', function(ev){
  ev.preventDefault();
  SB.auth.updateUser({password:$('#nPass').value}).then(function(r){
    if(r.error){ showMsg($('#newPassMsg'),'Não salvou: '+r.error.message,'err'); return; }
    S.recovering=false; $('#newPassForm').hidden=true; $('#loginForm').hidden=false; $('#loginSub').textContent='Entre com seu e-mail e senha';
    if(S.user) showApp();
  });
});
$('#logoutBtn').addEventListener('click', function(){ SB.auth.signOut(); });

SB.auth.onAuthStateChange(function(event, session){
  if(event==='PASSWORD_RECOVERY'){ S.recovering=true; S.user=session&&session.user; showLogin(); $('#loginForm').hidden=true; $('#newPassForm').hidden=false; $('#loginSub').textContent='Crie sua nova senha'; return; }
  var u = session && session.user;
  if(S.recovering && u){ S.user=u; return; }
  if(u){ var changed = !S.user || S.user.id!==u.id; S.user=u; if(changed || $('#appView').hidden) setTimeout(showApp,0); }
  else { S.user=null; S.org=null; showLogin(); }
});

if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('/sw.js').catch(function(){}); }); }
})();
</script>
